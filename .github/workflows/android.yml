name: Build Boussole GPS APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Creer les fichiers du projet
        run: |
          cat > settings.gradle.kts <<'BOUSSOLE_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Boussole"
          include(":app")
          BOUSSOLE_EOF
          cat > build.gradle.kts <<'BOUSSOLE_EOF'
          plugins {
