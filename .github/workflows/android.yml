          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.widget.Toast
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.*
          
          class MainActivity : Activity(), LocationListener {
              private lateinit var lm: LocationManager
              private lateinit var compass: CompassView
              private lateinit var sunDial: CompassView
              private lateinit var tvHeading: TextView
              private lateinit var tvState: TextView
              private lateinit var tvInfo: TextView
              private lateinit var tvSunMain: TextView
              private lateinit var tvSunHelp: TextView
              private lateinit var pages: List<View>
              private lateinit var tabs: List<TextView>
              private var cFg = 0
              private var cAccent = 0
          
              private val handler = Handler(Looper.getMainLooper())
              private var last: Location? = null
              private var prev: Location? = null
              private var lastFixMs = 0L
              private var shown = Float.NaN
              private var knownHeading = Float.NaN
              private var moving = false
              private var speedMs = 0f
              private var running = false
              private lateinit var sm: SensorManager
              private var rotSensor: Sensor? = null
              private var sensorHeading = Float.NaN
              private var sensorAcc = 3
              private var decl = 0f
              private lateinit var tvPos: TextView
              private val sensorListener = object : SensorEventListener {
                  private val r = FloatArray(9)
                  private val r2 = FloatArray(9)
                  private val o = FloatArray(3)
                  override fun onSensorChanged(e: SensorEvent) {
                      SensorManager.getRotationMatrixFromVector(r, e.values)
                      SensorManager.getOrientation(r, o)
                      var mtx = r
                      if (abs(Math.toDegrees(o[1].toDouble())) > 50) {
                          SensorManager.remapCoordinateSystem(r, SensorManager.AXIS_X, SensorManager.AXIS_Z, r2)
                          mtx = r2
                      }
                      SensorManager.getOrientation(mtx, o)
                      var h = Math.toDegrees(o[0].toDouble()).toFloat() + decl
                      h = (h + 720f) % 360f
                      sensorHeading = if (sensorHeading.isNaN()) h else {
                          val dd = ((h - sensorHeading + 540f) % 360f) - 180f
                          (sensorHeading + dd * 0.15f + 360f) % 360f
                      }
                      sensorAcc = e.accuracy
                  }
                  override fun onAccuracyChanged(s: Sensor?, a: Int) { sensorAcc = a }
              }
          
              private val ticker = object : Runnable {
                  override fun run() { refresh(); handler.postDelayed(this, 1000) }
              }
          
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  lm = getSystemService(LOCATION_SERVICE) as LocationManager
                  sm = getSystemService(SENSOR_SERVICE) as SensorManager
                  rotSensor = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
                  val bg = getColor(R.color.bg); cFg = getColor(R.color.fg); cAccent = getColor(R.color.accent)
                  val dial = getColor(R.color.dial); val muted = getColor(R.color.muted)
          
                  tvHeading = tv(56, true, cFg)
                  compass = CompassView(this).apply { cDial = dial; cFg = this@MainActivity.cFg; cAccent = this@MainActivity.cAccent; cMuted = muted }
                  tvState = tv(24, true, 0xFFFFFFFF.toInt()).apply { setPadding(dp(16), dp(12), dp(16), dp(12)) }
                  tvInfo = tv(20, false, cFg).apply { gravity = Gravity.START }
                  val p1 = page(tvHeading, compass, tvState, tvInfo)
          
                  sunDial = CompassView(this).apply { cDial = dial; cFg = this@MainActivity.cFg; cAccent = 0xFFF9A825.toInt(); cMuted = muted }
                  tvSunMain = tv(24, true, cFg)
                  tvSunHelp = tv(20, false, cFg).apply { gravity = Gravity.START }
                  val p2 = page(sunDial, tvSunMain, tvSunHelp)
          
                  val help = "Comment \u00e7a marche\n\n" +
                      "BOUSSOLE : si votre t\u00e9l\u00e9phone a un capteur magn\u00e9tique, la boussole marche en direct, m\u00eame \u00e0 l'arr\u00eat. Sinon, l'application utilise le GPS : quand vous marchez ou roulez, la fl\u00e8che montre votre direction de d\u00e9placement. \u00c0 l'arr\u00eat, elle garde la derni\u00e8re direction connue.\n\n" +
                      "SOLEIL : fonctionne sans bouger, m\u00eame \u00e0 l'int\u00e9rieur pr\u00e8s d'une fen\u00eatre, gr\u00e2ce \u00e0 l'heure et \u00e0 votre position. Elle indique o\u00f9 est le Soleil, donc o\u00f9 est le nord par rapport \u00e0 lui.\n\n" +
                      "Aucune m\u00e9thode ne peut mesurer l'orientation du t\u00e9l\u00e9phone \u00e0 l'arr\u00eat sans capteur : le mode Soleil est approximatif.\n\n" +
                      "Ne regardez jamais le Soleil directement."
                  val p3 = page(tv(20, false, cFg).apply { gravity = Gravity.START; text = help })
          
                  tvPos = tv(20, false, cFg).apply { gravity = Gravity.START }
                  val p4 = page(tvPos, btn("Partager ma position") { sharePos() }, btn("Copier les coordonn\u00e9es") { copyPos() })
                  pages = listOf(p1, p2, p4, p3)
                  val content = FrameLayout(this)
                  pages.forEach { content.addView(it) }
                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setBackgroundColor(dial) }
                  tabs = listOf("Boussole", "Soleil", "Position", "Aide").mapIndexed { i, t ->
                      tv(16, true, cFg).apply {
                          text = t; setPadding(0, dp(18), 0, dp(18)); setOnClickListener { show(i) }
                      }
                  }
                  tabs.forEach { bar.addView(it, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setBackgroundColor(bg)
                      addView(content, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                      addView(bar)
                  }
                  setContentView(root)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = bg; window.navigationBarColor = dial
                  show(0); refresh()
              }
          
              private fun btn(label: String, onClick: () -> Unit) = tv(20, true, 0xFFFFFFFF.toInt()).apply {
                  text = label
                  setPadding(dp(16), dp(16), dp(16), dp(16))
                  background = GradientDrawable().apply { cornerRadius = dp(16).toFloat(); setColor(cAccent) }
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(12) }
              }
          
              private fun posText(): String? {
                  val l = anyLoc() ?: return null
                  return String.format(Locale.US, "%.6f,%.6f", l.latitude, l.longitude)
              }
          
              private fun sharePos() {
                  val p = posText()
                  if (p == null) { Toast.makeText(this, "Position indisponible", Toast.LENGTH_SHORT).show(); return }
                  val i = Intent(Intent.ACTION_SEND).apply {
                      type = "text/plain"
                      putExtra(Intent.EXTRA_TEXT, "Ma position : https://maps.google.com/?q=" + p)
                  }
                  startActivity(Intent.createChooser(i, "Partager"))
              }
          
              private fun copyPos() {
                  val p = posText()
                  if (p == n
