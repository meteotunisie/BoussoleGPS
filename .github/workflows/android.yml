          BOUSSOLE_EOF
          cat > gradle.properties <<'BOUSSOLE_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          BOUSSOLE_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'BOUSSOLE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.boussolgps.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.boussolgps.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
